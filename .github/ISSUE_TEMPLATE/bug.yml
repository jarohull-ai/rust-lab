name: Bug report
description: Report a reproducible Rust Lab problem
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Rust Lab. Never include credentials or private source code.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start Rust Lab…\n2. Open…\n3. Click…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rust Lab version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Product mode
      options: [Graph, Lab, Both, Startup or build]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust, Node.js, browser, and reported sandbox backend.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove credentials, personal paths, private code, and raw payloads.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
