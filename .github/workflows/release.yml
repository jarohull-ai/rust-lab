name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or find prerelease
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TITLE: Polyglot Lab ${{ github.ref_name }}
          RELEASE_NOTES: |
            ## Polyglot Lab Desktop Installers

            The visual-to-code educational platform supporting **Rust, Go, Python, and C++**.

            ### Downloads:
            - **Windows**: `.msi` or `.exe` installer (x64)
            - **macOS**: `.dmg` (Apple Silicon M-series)
            - **Linux**: `.AppImage` (portable) or `.deb` (Ubuntu/Debian)

            *No server required. Fully offline-capable.*
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq .id)"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    name: Build (${{ matrix.platform }})
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install UI dependencies and build web assets
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build Tauri Desktop Application and Upload Installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './src-tauri'
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
