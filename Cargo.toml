[workspace]
resolver = "2"
members = [
    "crates/lab-node-sdk",
    "crates/runtime",
    "crates/api",
]
exclude = [
    "src-tauri",
    "vendor/glib-0.18.5-rustlab",
]

[workspace.package]
version = "0.4.2-alpha.3"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Rust Lab Contributors"]
repository = "https://github.com/jarohull-ai/rust-lab"
homepage = "https://github.com/jarohull-ai/rust-lab"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
async-trait = "0.1"
anyhow = "1.0"
seed-core = "0.1.6"
