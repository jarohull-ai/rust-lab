[workspace]
resolver = "2"
members = [
    "crates/lab-node-sdk",
    "crates/runtime",
    "crates/api",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Rust Lab Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
async-trait = "0.1"
anyhow = "1.0"
seed-core = "0.1.6"
